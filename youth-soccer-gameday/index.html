<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Boot Room</title>
  <meta name="description" content="Boot Room — game-day management for youth soccer teams: roster, fixtures, RSVPs, lineup builder, and live substitution tracking." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><path d=%22M24 3 L43 9 V22 C43 33 35.5 40.5 24 45 C12.5 40.5 5 33 5 22 V9 Z%22 fill=%22%2316693f%22 stroke=%22%23e6f6ec%22 stroke-width=%222%22/><text x=%2224%22 y=%2230%22 font-family=%22Georgia,serif%22 font-weight=%22700%22 font-size=%2221%22 fill=%22%23ffffff%22 text-anchor=%22middle%22>B</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a href="#/" class="brand">
          <span class="brand-badge" id="brand-badge" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="22" height="22">
              <path d="M24 3 L43 9 V22 C43 33 35.5 40.5 24 45 C12.5 40.5 5 33 5 22 V9 Z" fill="var(--green-500)" stroke="#ffffff" stroke-width="2"/>
              <text x="24" y="30" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="21" fill="#ffffff" text-anchor="middle">B</text>
            </svg>
          </span>
          <span class="brand-text" id="brand-team-name">Boot Room</span>
        </a>
      </div>
    </header>

    <main id="app" class="app"></main>

    <nav id="nav" class="bottom-nav" aria-label="Primary"></nav>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    // A stale cached copy of the app's JS has repeatedly caused confusing,
    // hard-to-diagnose failures (a bug fix looking like it "didn't work")
    // with zero visible symptom pointing at the real cause. This check is
    // deliberately NOT part of the app's own module bundle — if it were,
    // it would suffer from exactly the same staleness it's meant to
    // detect. version.txt is stamped with the deploy's commit SHA by the
    // GitHub Pages workflow on every push, and this fetch always bypasses
    // any cache (no-store plus a timestamp no cache could have a stored
    // response for), so it reliably sees the CURRENT version even when
    // everything else on the page is running an old cached copy.
    (function () {
      var STORAGE_KEY = 'ysg-seen-app-version';
      fetch('version.txt?_ts=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.text() : null; })
        .then(function (current) {
          if (!current) return;
          current = current.trim();
          var seen = null;
          try { seen = localStorage.getItem(STORAGE_KEY); } catch (e) {}
          if (!seen) {
            try { localStorage.setItem(STORAGE_KEY, current); } catch (e) {}
            return;
          }
          if (seen === current) return;
          var bar = document.createElement('div');
          bar.setAttribute('role', 'alert');
          bar.style.cssText = 'position:fixed; left:0; right:0; bottom:0; z-index:9999; background:#92400e; color:#fff; font:13px/1.4 -apple-system,sans-serif; padding:12px 14px; box-shadow:0 -2px 10px rgba(0,0,0,.2);';
          bar.innerHTML =
            '<strong>A newer version of this app is available.</strong> Your browser is showing an older cached copy, which can make recent fixes look like they didn\'t work. ' +
            'To update: on iPhone/Android, open your browser\'s menu → Settings → Privacy → Clear Browsing Data, and check ONLY “Cached Images and Files.” ' +
            '<strong>Leave “Cookies and Site Data” unchecked</strong> — that’s what holds your team’s actual data, and clearing it deletes everything on this device. ' +
            'Then fully close and reopen the browser.' +
            '<div style="margin-top:8px;"><button type="button" style="background:#fff; color:#92400e; border:none; border-radius:6px; padding:6px 12px; font-weight:700; cursor:pointer;">Got it</button></div>';
          bar.querySelector('button').addEventListener('click', function () {
            try { localStorage.setItem(STORAGE_KEY, current); } catch (e) {}
            bar.remove();
          });
          document.body.appendChild(bar);
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
