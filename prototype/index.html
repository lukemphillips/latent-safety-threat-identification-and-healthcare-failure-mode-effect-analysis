<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trauma Documentation — Mater ED (Prototype)</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="login-screen" class="login-wrap">
  <form class="login-card" id="login-form">
    <h1>Trauma Documentation</h1>
    <p class="sub">Mater ED &middot; prototype build</p>
    <div id="login-error"></div>
    <div class="field">
      <label for="login-username">Username</label>
      <input type="text" id="login-username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn big" style="width:100%">Log in</button>
    <p class="hint">Demo account: <b>admin</b> / <b>mater2026</b> — prototype only, not a real auth system (see plan §10.4 for the production design).</p>
  </form>
</div>

<div id="app-shell" class="app-shell" style="display:none">
  <div class="topbar">
    <span class="brand">🩺 Trauma Doc</span>
    <span class="case-id" id="case-id-label">No active case</span>
    <div class="user-chip"><span id="user-name-label"></span></div>
    <button class="ghost" id="btn-new-case">New case</button>
    <button class="ghost" id="btn-team-display">Open team display ↗</button>
    <button class="ghost" id="btn-admin" style="display:none">Admin</button>
    <button class="ghost" id="btn-logout">Log out</button>
    <span class="clock" id="clock">00:00</span>
  </div>

  <div class="patient-banner" id="patient-banner"></div>

  <div class="stage-nav" id="stage-nav"></div>

  <div class="main-area" id="main-area"></div>
</div>

<div id="modal-root"></div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
